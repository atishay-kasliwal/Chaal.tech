<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 357" role="img" aria-labelledby="t">
	<title id="t">Chaal card back</title>
	<!-- Original design in the classic engraved style: point-symmetric, so a card reads the same either way up. -->
	<defs>
		<pattern id="stipple" width="5" height="5" patternUnits="userSpaceOnUse">
			<circle cx="2.5" cy="2.5" r="0.8" fill="#fff" />
		</pattern>
		<!-- Faint woven finish over the whole print. -->
		<pattern id="finish" width="3" height="3" patternUnits="userSpaceOnUse">
			<rect width="3" height="3" fill="none" />
			<circle cx="1.5" cy="1.5" r="0.5" fill="#000" opacity=".035" />
		</pattern>
		<!-- One corner flourish: scroll, leaf and rosette; mirrored into all four corners. -->
		<g id="corner" fill="none" stroke="#fff" stroke-linecap="round">
			<path d="M24 64c0-22 12-38 34-40" stroke-width="2.4" />
			<path d="M58 24c-12 4-16 16-8 22c6 4 13-1 11-7c-1-4-6-5-8-2" stroke-width="2" />
			<path d="M24 64c4-12 14-16 22-10c5 4 3 12-3 12c-4 0-5-5-2-7" stroke-width="2" />
			<path d="M32 50c6-8 12-12 20-14" stroke-width="1.2" />
			<path d="M30 40l6 6M40 30l6 6M28 52l5 3M50 28l3 5" stroke-width="1.1" />
			<circle cx="44" cy="44" r="6.5" fill="#fff" stroke="none" />
			<g fill="#1d5a3c" stroke="none">
				<circle cx="44" cy="44" r="2.2" />
				<circle cx="44" cy="39.4" r="1.3" />
				<circle cx="44" cy="48.6" r="1.3" />
				<circle cx="39.4" cy="44" r="1.3" />
				<circle cx="48.6" cy="44" r="1.3" />
			</g>
			<path d="M64 24c6 0 10 3 12 8M24 70c0 6 3 10 8 12" stroke-width="1.4" />
		</g>
		<!-- Heart-leaf border motif with a centre vein. -->
		<g id="leaf">
			<path d="M0-8c6 0 8 6 0 15c-8-9-6-15 0-15z" fill="#fff" />
			<path d="M0-5v10" stroke="#1d5a3c" stroke-width="1.2" stroke-linecap="round" />
			<path d="M-3 0l3 2l3-2" fill="none" stroke="#1d5a3c" stroke-width=".9" stroke-linecap="round" />
		</g>
		<!-- Ornate spade for the medallions. -->
		<g id="spade">
			<path d="M0-26c10 12 26 20 26 34c0 9-8 14-15 11c-4-2-7-5-9-9c1 9 4 15 10 20h-24c6-5 9-11 10-20c-2 4-5 7-9 9c-7 3-15-2-15-11c0-14 16-22 26-34z" fill="#fff" />
			<path d="M0-16c6 8 15 13 15 22c0 4-3 6-6 5" fill="none" stroke="#1d5a3c" stroke-width="1.3" stroke-linecap="round" />
			<path d="M0-16c-6 8-15 13-15 22c0 4 3 6 6 5" fill="none" stroke="#1d5a3c" stroke-width="1.3" stroke-linecap="round" />
		</g>
		<!-- One medallion: double ring, sea-wave lines, birds and a spade. -->
		<g id="medallion">
			<circle r="45" fill="#1d5a3c" stroke="#fff" stroke-width="2.6" />
			<circle r="40" fill="none" stroke="#fff" stroke-width=".9" />
			<g fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round">
				<path d="M-34 14c6-3 10 3 16 0s10-3 16 0s10 3 16 0s10-3 16 0" />
				<path d="M-30 22c6-3 10 3 16 0s10-3 16 0s10 3 16 0s10-3 16 0" />
				<path d="M-22 29c6-3 10 3 16 0s10-3 14 0s10 3 14 0" />
				<path d="M-26-18l3 2l3-2M18-22l3 2l3-2M24-10l2.5 1.6l2.5-1.6M-30-6l2.5 1.6l2.5-1.6" />
			</g>
			<use href="#spade" transform="translate(0 -6) scale(.78)" />
		</g>
	</defs>

	<!-- Card stock with a white border, then the navy print. -->
	<rect width="250" height="357" rx="14" fill="#fbfaf5" />
	<rect x="11" y="11" width="228" height="335" rx="6" fill="#1d5a3c" />
	<rect x="16" y="16" width="218" height="325" rx="3" fill="none" stroke="#fff" stroke-width="2.2" />
	<rect x="20.5" y="20.5" width="209" height="316" rx="2" fill="none" stroke="#fff" stroke-width=".8" />

	<!-- Corners -->
	<use href="#corner" />
	<use href="#corner" transform="translate(250 0) scale(-1 1)" />
	<use href="#corner" transform="translate(0 357) scale(1 -1)" />
	<use href="#corner" transform="rotate(180 125 178.5)" />

	<!-- Side borders: a curling vine with leaves, mirrored left/right. -->
	<g id="side"><path d="M36.0 100.5 Q42.5 107.0 36.0 113.5 Q29.5 120.0 36.0 126.5 Q29.5 133.0 36.0 139.5 Q42.5 146.0 36.0 152.5 Q42.5 159.0 36.0 165.5 Q29.5 172.0 36.0 178.5 Q29.5 185.0 36.0 191.5 Q42.5 198.0 36.0 204.5 Q42.5 211.0 36.0 217.5 Q29.5 224.0 36.0 230.5 Q29.5 237.0 36.0 243.5 Q42.5 250.0 36.0 256.5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="39.6" cy="107.0" r="2.1" fill="none" stroke="#fff" stroke-width="1.1"/><use href="#leaf" transform="translate(29.8 120.0) rotate(90) scale(.55)"/><circle cx="32.4" cy="133.0" r="2.1" fill="none" stroke="#fff" stroke-width="1.1"/><use href="#leaf" transform="translate(42.2 146.0) rotate(-90) scale(.55)"/><circle cx="39.6" cy="159.0" r="2.1" fill="none" stroke="#fff" stroke-width="1.1"/><use href="#leaf" transform="translate(29.8 172.0) rotate(90) scale(.55)"/><circle cx="32.4" cy="185.0" r="2.1" fill="none" stroke="#fff" stroke-width="1.1"/><use href="#leaf" transform="translate(42.2 198.0) rotate(-90) scale(.55)"/><circle cx="39.6" cy="211.0" r="2.1" fill="none" stroke="#fff" stroke-width="1.1"/><use href="#leaf" transform="translate(29.8 224.0) rotate(90) scale(.55)"/><circle cx="32.4" cy="237.0" r="2.1" fill="none" stroke="#fff" stroke-width="1.1"/><use href="#leaf" transform="translate(42.2 250.0) rotate(-90) scale(.55)"/><use href="#leaf" transform="translate(36 178.5) rotate(90) scale(1.3)"/></g>
	<use href="#side" transform="translate(250 0) scale(-1 1)" />
	<g id="topEdge"><path d="M85.0 36.0 Q90.0 41.0 95.0 36.0 Q100.0 31.0 105.0 36.0 Q110.0 31.0 115.0 36.0 Q120.0 41.0 125.0 36.0 Q130.0 41.0 135.0 36.0 Q140.0 31.0 145.0 36.0 Q150.0 31.0 155.0 36.0 Q160.0 41.0 165.0 36.0" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="90.0" cy="38.8" r="2.1" fill="none" stroke="#fff" stroke-width="1.1"/><use href="#leaf" transform="translate(100.0 31.2) rotate(180) scale(.55)"/><circle cx="110.0" cy="33.2" r="2.1" fill="none" stroke="#fff" stroke-width="1.1"/><use href="#leaf" transform="translate(120.0 40.8) rotate(0) scale(.55)"/><circle cx="130.0" cy="38.8" r="2.1" fill="none" stroke="#fff" stroke-width="1.1"/><use href="#leaf" transform="translate(140.0 31.2) rotate(180) scale(.55)"/><circle cx="150.0" cy="33.2" r="2.1" fill="none" stroke="#fff" stroke-width="1.1"/><use href="#leaf" transform="translate(160.0 40.8) rotate(0) scale(.55)"/><use href="#leaf" transform="translate(125 36) rotate(180) scale(1.2)"/></g>
	<use href="#topEdge" transform="rotate(180 125 178.5)" />

	<!-- Inner field: stippled, framed by a double line. -->
	<rect x="52" y="56" width="146" height="245" rx="4" fill="#1d5a3c" />
	<rect x="52" y="56" width="146" height="245" rx="4" fill="url(#stipple)" opacity=".55" />
	<rect x="52" y="56" width="146" height="245" rx="4" fill="none" stroke="#fff" stroke-width="1.6" />
	<rect x="56" y="60" width="138" height="237" rx="3" fill="none" stroke="#fff" stroke-width=".7" />

	<!-- Sunburst behind the hub, between the two medallions. -->
	<g stroke="#fff" stroke-width="1.1" stroke-linecap="round">
		<path d="M125 178.5l-50-8M125 178.5l-52 0M125 178.5l-50 8M125 178.5l-44-16M125 178.5l-44 16M125 178.5l50-8M125 178.5l52 0M125 178.5l50 8M125 178.5l44-16M125 178.5l44 16" />
	</g>

	<use href="#medallion" transform="translate(125 128)" />
	<use href="#medallion" transform="rotate(180 125 178.5) translate(125 128)" />

	<!-- Hub: the point the design turns on. -->
	<circle cx="125" cy="178.5" r="12" fill="#1d5a3c" stroke="#fff" stroke-width="2.4" />
	<circle cx="125" cy="178.5" r="6.5" fill="none" stroke="#fff" stroke-width="1.4" />
	<circle cx="125" cy="178.5" r="2.4" fill="#fff" />

	<rect width="250" height="357" rx="14" fill="url(#finish)" />
</svg>
