<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" role="img" aria-labelledby="title desc">
	<title id="title">Chaal.tech</title>
	<desc id="desc">Chaal.tech social card games logo: three fanned playing cards with all four suits beside the Chaal.tech wordmark.</desc>
	<defs>
