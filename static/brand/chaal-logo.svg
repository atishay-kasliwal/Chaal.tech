		<rect x="3.75" y="3.75" width="120.5" height="120.5" rx="29.25" fill="none" stroke="url(#gold)" stroke-opacity=".7" stroke-width="1.5" />
		<g fill="#10271c" stroke="url(#gold)" stroke-width="3.5" stroke-linejoin="round">
			<rect x="27" y="30" width="43" height="66" rx="7" transform="rotate(-16 48.5 63)" />
