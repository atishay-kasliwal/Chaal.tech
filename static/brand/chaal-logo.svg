			<circle cx="14.7" cy="10.7" r="4" />
			<path d="M8.2 10.7 6.5 19h7l-1.7-8.3z" />
		</symbol>
		<symbol id="diamond" viewBox="0 0 20 20">
			<path d="m10 1 8 9-8 9-8-9 8-9Z" />
