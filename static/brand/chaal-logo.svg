			<stop stop-color="#173c2b" />
			<stop offset="1" stop-color="#091b13" />
		</linearGradient>
		<linearGradient id="gold" x1="25" y1="23" x2="102" y2="102" gradientUnits="userSpaceOnUse">
			<stop stop-color="#f1d693" />
			<stop offset="1" stop-color="#bb8435" />
		</linearGradient>
		<symbol id="spade" viewBox="0 0 20 20">
