		<use href="#spade" x="51" y="46" width="11" height="11" fill="#173c2b" />
		<use href="#heart" x="66" y="46" width="11" height="11" fill="#a63b32" />
		<use href="#club" x="51" y="62" width="11" height="11" fill="#173c2b" />
		<use href="#diamond" x="66" y="62" width="11" height="11" fill="#a63b32" />
