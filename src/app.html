<!doctype html>
<html lang="en" data-theme="teen-patti">
	<head>
		<meta charset="utf-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="%sveltekit.assets%/brand/chaal-mark.svg"
			sizes="any"
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/bricolage-grotesque-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<meta name="theme-color" content="#211c2e" />
		<meta property="og:site_name" content="Chaal.tech" />
		<meta property="og:title" content="Chaal.tech · Social Card Games" />
		<meta
			property="og:description"
			content="Gather your friends for Teen Patti and card games around one virtual table."
		/>
		<meta property="og:image" content="https://chaal.tech/brand/chaal-social.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://chaal.tech/brand/chaal-social.png" />
		<title>Chaal.tech · Social Card Games</title>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" class="min-h-screen max-w-full">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
